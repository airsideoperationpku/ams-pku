<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; overflow-x: hidden; }
        .wrapper { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        .sidebar { min-width: 250px; max-width: 250px; background-color: #ffffff; border-right: 1px solid #eaeaea; display: flex; flex-direction: column; transition: all 0.3s ease; z-index: 1050; }

        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #f0f0f0; margin-bottom: 15px; }
        .sidebar-header h5 { margin: 0; font-weight: 700; color: #2c3e50; font-size: 1.1rem; }
        .user-profile-box { margin: 0 15px 15px; padding: 10px 12px; border: 1px solid #e9ecef; border-radius: 10px; background: #f8f9fa; }

        .content { flex-grow: 1; padding: 20px 30px; overflow-y: auto; min-width: 0; transition: all 0.3s ease; }
        
        /* Grid Parking Stand */
        .stand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
        
        /* Card Stand Base Layout (modern) */
        .stand-card { 
            position: relative;
            background: #ffffff;
            border: 1px solid #e6eaf0; 
            border-radius: 18px; 
            overflow: hidden; 
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05), 0 8px 20px rgba(15, 23, 42, 0.05);

        }
        .stand-card:hover {

        }
        /* Garis aksen warna di atas kartu */
        .stand-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: #94a3b8;
            z-index: 2;
        }
        .stand-card.ready::before { background: #22c55e; }
        .stand-card.standby::before { background: #f59e0b; }
        .stand-card.occupied::before { background: #ef4444; }

        .pair-box { background: #f8fafc; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #eef1f5; }

        @media (max-width: 768px) { .sidebar { position: fixed; left: -250px; height: 100vh; } .sidebar.show { left: 0; box-shadow: 2px 0 15px rgba(0,0,0,0.2); } .sidebar-overlay.show { display: block; } .content { padding: 15px; } }

            .bottom-nav { display: flex; }

<script>
    const supabaseUrl = 'https://hnlnkhbwbidthnupzhbp.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubG5raGJ3YmlkdGhudXB6aGJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NDE5NjYsImV4cCI6MjA5MzExNzk2Nn0.NZkxKilb-CwTx3ffmzc8_sVOaSgeulJAihJUxaoRTXI';
    let sbClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

    function toggleSidebar() { const s = document.getElementById('sidebar'); if (window.innerWidth <= 768) { s.classList.toggle('show'); document.getElementById('sidebarOverlay').classList.toggle('show'); } else { s.classList.toggle('collapsed'); localStorage.setItem('ams_sidebar_collapsed', s.classList.contains('collapsed') ? '1' : '0'); } }
    function applySidebarState() { if (window.innerWidth <= 768) return; const s = document.getElementById('sidebar'); if (!s) return; if (localStorage.getItem('ams_sidebar_collapsed') === '1') { s.classList.add('no-transition'); s.classList.add('collapsed'); void s.offsetWidth; s.classList.remove('no-transition'); } }
    applySidebarState();

    async function initUserProfile() {
        if (!sbClient) return;
        try {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            const user = session.user || {};
            const storedName = localStorage.getItem('ams_user_name') || '';
            const storedEmail = localStorage.getItem('ams_user_email') || '';
            const metadataName = user?.user_metadata?.full_name || user?.user_metadata?.name || '';
            const finalName = (metadataName && metadataName.trim()) || storedName || (user.email ? user.email.split('@')[0] : 'User');
            const finalEmail = user.email || storedEmail || '-';

            localStorage.setItem('ams_user_name', finalName);
            localStorage.setItem('ams_user_email', finalEmail);
            localStorage.setItem('ams_user_id', user.id || '');

            const elName = document.getElementById('profileName');
            const elEmail = document.getElementById('profileEmail');
            if (elName) elName.textContent = finalName;
            if (elEmail) elEmail.textContent = finalEmail;
        } catch (err) {
            console.error('Gagal inisialisasi profil user:', err);
            window.location.replace('index.html');
        }
    }
    
    setInterval(() => { 
        document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { 
            timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' 
        }); 
    }, 1000);

    function getLocalDateString(offsetDays = 0) { 
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' }); // Format YYYY-MM-DD
    }

    const todayStr = getLocalDateString(0);
    const tomorrowStr = getLocalDateString(1);
    const yesterdayStr = getLocalDateString(-1);

    function formatTimeWithDate(dateStr, timeStr) {
        if (!timeStr) return '-';
        if (dateStr === todayStr) return timeStr;
        if (dateStr === tomorrowStr) return `${timeStr} <span class="badge bg-warning text-dark border border-warning ms-1" style="font-size:0.6rem;">BESOK</span>`;
        if (dateStr === yesterdayStr) return `${timeStr} <span class="badge bg-secondary text-white border border-secondary ms-1" style="font-size:0.6rem;">KEMARIN</span>`;
        
        let dObj = new Date(dateStr);
        let dFmt = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}`;
        return `${timeStr} <span class="badge bg-secondary text-white ms-1" style="font-size:0.6rem;">${dFmt}</span>`;
    }

    function getOccupiedMinutesFromFlight(flight) {
        if (!flight) return 0;

        const baseTime = (flight.block_time || flight.jadwal || '').trim();
        if (!baseTime) return 0;

        const datePart = (flight.date || '').trim();
        if (!datePart) return 0;

        const hhmm = baseTime.match(/^(\d{1,2}):(\d{2})/);
        if (!hhmm) return 0;

        const h = Number(hhmm[1]);
        const m = Number(hhmm[2]);
        if (Number.isNaN(h) || Number.isNaN(m)) return 0;

        const nowJkt = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
        const ref = new Date(`${datePart}T00:00:00`);
        ref.setHours(h, m, 0, 0);

        const diffMs = nowJkt - ref;
        return Math.max(0, Math.floor(diffMs / 60000));
    }

    // Helper: deteksi checkbox RON/ExRON dari field `ron`.
    function isRonFlag(f) {
        if (!f) return false;
        const v = f.ron;
        return v === true || v === 1 || v === '1' || v === 'true' || v === 'TRUE' || v === 't' || v === 'T';
    }

    // Helper: ekstrak waktu HH:MM dari string (robust thd "HH:MM", "HH:MM:SS", datetime, dsb).
    function normTimeStr(t) {
        const m = (t || '').toString().trim().match(/(\d{1,2}):(\d{2})/);
        if (!m) return null;
        const hh = String(Math.min(23, Math.max(0, Number(m[1])))).padStart(2, '0');
        const mm = String(Math.min(59, Math.max(0, Number(m[2])))).padStart(2, '0');
        return `${hh}:${mm}`;
    }

    // Helper: timestamp penerbangan (date + jadwal/block_time) dalam ms.
    // Pakai jadwal dulu (selalu ada & konsisten utk pairing), fallback block_time.
    // Robust thd date berupa timestamp penuh maupun "YYYY-MM-DD"; NaN/error -> MAX_SAFE_INTEGER.
    function flightTs(f) {
        const d = (f && f.date) ? String(f.date).trim().slice(0, 10) : '';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return Number.MAX_SAFE_INTEGER;
        const t = normTimeStr(f.jadwal) || normTimeStr(f.block_time);
        if (!t) return Number.MAX_SAFE_INTEGER;
        const ts = new Date(`${d}T${t}:00`).getTime();
        return Number.isNaN(ts) ? Number.MAX_SAFE_INTEGER : ts;
    }

    // Helper: ambil nomor parking stand (D1..D12 -> 1..12; NA/SA/kosong -> null).
    function standNumOf(f) {
        const s = (f && f.stand) ? String(f.stand).trim() : '';
        if (!s) return null;
        const n = parseInt(s.replace(/\D/g, ''), 10);
        return Number.isNaN(n) ? null : n;
    }

    // Helper: ambil kunci stand ("D1".."D12", "NA", "SA", atau null).
    function standKeyOf(f) {
        const s = (f && f.stand) ? String(f.stand).trim().toUpperCase() : '';
        if (!s) return null;
        if (s === 'NA' || s === 'SA') return s;
        const n = parseInt(s.replace(/\D/g, ''), 10);
        if (Number.isNaN(n) || n < 1 || n > 12) return null;
        return 'D' + n;
    }

    // Helper: ambil tanggal YYYY-MM-DD dari sebuah flight.
    function dateOf(f) {
        return (f && f.date) ? String(f.date).trim().slice(0, 10) : '';
    }

    // --- LOGIKA PARKING MONITOR ---
    async function updateParkingStands() {
        if(!sbClient) return;
        
        let datesToFetch = [];
        for (let i = -2; i <= 2; i++) datesToFetch.push(getLocalDateString(i));
        
        try {
            const { data: flights, error } = await sbClient.from('daily_flights').select('*').in('date', datesToFetch);
            if (error) throw error;
            
            const activeFlights = (flights || []).filter(f => f.status !== 'Cancel');

            let aircraftTracker = {};
            activeFlights.forEach(f => {
                let reg = (f.reg || '').trim().toUpperCase();
                if (!reg) reg = 'UNKNOWN_' + f.id; 
                const legType = String(f.leg || '').trim().toUpperCase();
                if (!aircraftTracker[reg]) aircraftTracker[reg] = [];
                aircraftTracker[reg].push({ type: legType, data: f });
            });

            let allFlightCycles = [];

            Object.keys(aircraftTracker).forEach(reg => {
                let legs = aircraftTracker[reg];

                let arrs = legs.filter(l => l.type === 'A').map(l => l.data);
                let deps = legs.filter(l => l.type === 'D').map(l => l.data);

                arrs.sort((a, b) => flightTs(a) - flightTs(b));
                deps.sort((a, b) => flightTs(a) - flightTs(b));

                const usedDepIds = new Set();

                arrs.forEach(a => {
                    const aTs = flightTs(a);
                    const aStand = standNumOf(a);
                    const aDate = dateOf(a);
                    const aRon = isRonFlag(a);

                    const candidates = deps
                        .filter(d => {
                            if (usedDepIds.has(d.id)) return false;
                            const dDate = dateOf(d);
                            // Pairing normal harus pada tanggal yang sama (turn).
                            // Cross-date HANYA utk RON (arr ron=true + dep ron=true/ExRON),
                            // agar arrival yang tak terpairing tidak "mencuri" departure
                            // tanggal berikutnya dan membuat turn berikutnya jadi OCCUPIED.
                            if (dDate === aDate) return true;
                            if (aRon && isRonFlag(d)) return true;
                            return false;
                        })
                        .map(d => {
                            const dTs = flightTs(d);
                            const dStand = standNumOf(d);

                            const sameStand = (aStand !== null && dStand !== null && aStand === dStand) ? 0 : 1;
                            const afterArr = dTs >= aTs ? 0 : 1;
                            const delta = Math.abs(dTs - aTs);

                            return { d, sameStand, afterArr, delta };
                        });

                    if (candidates.length === 0) {
                        allFlightCycles.push({ arr: a, dep: null, reg: reg });
                        return;
                    }

                    candidates.sort((x, y) =>
                        (x.sameStand - y.sameStand) ||
                        (x.afterArr - y.afterArr) ||
                        (x.delta - y.delta)
                    );

                    const chosen = candidates[0]?.d || null;

                    if (chosen) {
                        usedDepIds.add(chosen.id);
                        allFlightCycles.push({ arr: a, dep: chosen, reg: reg });
                    } else {
                        allFlightCycles.push({ arr: a, dep: null, reg: reg });
                    }
                });

                deps.forEach(d => {
                    if (!usedDepIds.has(d.id)) {
                        allFlightCycles.push({ arr: null, dep: d, reg: reg });
                    }
                });
            });

            let relevantCycles = [];
            
            allFlightCycles.forEach(c => {
                let a = c.arr;
                let d = c.dep;

                let standKey = a ? standKeyOf(a) : null;
                if (!standKey && d) standKey = standKeyOf(d);

                if (!standKey) return;

                let cycleStatus = 'READY';
                let d_hasBlock = d && d.block_time && d.block_time.trim() !== '';
                let a_hasBlock = a && a.block_time && a.block_time.trim() !== '';

                if (d_hasBlock) {
                    cycleStatus = 'READY'; 
                } else {
                    if (a) {
                        cycleStatus = a_hasBlock ? 'OCCUPIED' : 'STANDBY';
                    } else if (d) {
                        cycleStatus = 'OCCUPIED'; 
                    }
                }

                if (cycleStatus === 'READY') return; 
                if (cycleStatus === 'STANDBY' && a && a.date > todayStr) return; 

                // Skip arrival yatim (tanpa departure) yang non-RON dan tanggalnya sudah lewat,
                // karena itu data tidak lengkap (departure belum diinput), bukan kondisi OCCUPIED saat ini.
                const aDate = a ? dateOf(a) : '';
                if (cycleStatus === 'OCCUPIED' && a && !d && !isRonFlag(a) && aDate && aDate < todayStr) return;

                // RON ditentukan dari CHECKBOX ron (RON/ExRON), BUKAN dari selisih tanggal.
                // Sebelumnya banyak stand keliru jadi RON karena selisih tanggal atau
                // arrival/departure yang tak terpairing dianggap RON.
                let isRON = isRonFlag(a) || isRonFlag(d);

                let primary = a || d;
                let sortKey = primary ? (String(primary.date || '').trim().slice(0, 10) + (normTimeStr(primary.jadwal) || normTimeStr(primary.block_time) || '99:99')) : '99:9999:99';

                relevantCycles.push({
                    arr: a, dep: d, reg: c.reg, standKey: standKey, status: cycleStatus,
                    sortTime: sortKey, isRON: isRON
                });
            });

            const ALL_STANDS = ['D1','D2','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12'];
            const SPECIAL_STANDS = ['NA','SA'];

            let standsData = {};
            ALL_STANDS.concat(SPECIAL_STANDS).forEach(k => { standsData[k] = { status: 'READY', current: null, next: null }; });

            relevantCycles.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

            ALL_STANDS.concat(SPECIAL_STANDS).forEach(k => {
                let cyclesInStand = relevantCycles.filter(c => c.standKey === k);
                if (cyclesInStand.length === 0) return;

                let occupiedCycle = cyclesInStand.find(c => c.status === 'OCCUPIED');
                let standbyCycles = cyclesInStand.filter(c => c.status === 'STANDBY');

                if (occupiedCycle) {
                    standsData[k].status = 'OCCUPIED';
                    standsData[k].current = occupiedCycle;
                    if (standbyCycles.length > 0) standsData[k].next = standbyCycles[0];
                } else if (standbyCycles.length > 0) {
                    standsData[k].status = 'STANDBY';
                    standsData[k].current = standbyCycles[0];
                    if (standbyCycles.length > 1) standsData[k].next = standbyCycles[1];
                }
            });

            // Stand yang selalu tampil (D1..D12) + NA/SA hanya jika ada flight aktif.
            const standsToRender = ALL_STANDS.slice();
            SPECIAL_STANDS.forEach(k => { if (standsData[k].current) standsToRender.push(k); });

            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            standsToRender.forEach(standKey => {
                const stand = standsData[standKey];
                const card = document.createElement('div');

                let isOver45 = false;
                if (stand.status === 'OCCUPIED' && stand.current && stand.current.arr && !stand.current.isRON) {
                    const occupiedMins = getOccupiedMinutesFromFlight(stand.current.arr);
                    isOver45 = occupiedMins > 45;
                }

                card.className = `stand-card ${stand.status.toLowerCase()}${isOver45 ? ' alert-45' : ''}`;

                let headerColor = 'text-success', badgeColor = 'bg-success';
                if (stand.status === 'STANDBY') { headerColor = 'text-warning'; badgeColor = 'bg-warning text-dark'; }
                if (stand.status === 'OCCUPIED') { headerColor = 'text-danger'; badgeColor = 'bg-danger'; }

                let bodyContent = '';
                
                if (stand.status === 'READY') {
                    bodyContent = `
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <div class="text-center text-success py-3">
                                <i class="bi bi-check-circle-fill fs-1 d-block mb-1"></i>
                                <span class="small fw-bold text-uppercase tracking-wide">Ready to Use</span>
                            </div>
                        </div>`;
                } 
                else if (stand.current) {
                    let arr = stand.current.arr;
                    let dep = stand.current.dep;
                    let primary = arr || dep;
                    
                    let ronBadgeHtml = stand.current.isRON ? `<span class="badge bg-primary ms-2 shadow-sm border border-light px-2" style="font-size:0.75rem;"><i class="bi bi-moon-stars-fill me-1"></i>RON</span>` : '';

                    bodyContent += `<div class="flight-info text-dark">`;

                    if (stand.status === 'OCCUPIED') {
                        bodyContent += `
                            <div class="text-center mb-2 pb-1 border-bottom d-flex justify-content-center align-items-center flex-wrap">
                                <span class="fs-6 fw-bold text-danger"><i class="bi bi-airplane-fill me-1"></i> ON BLOCK: ${primary.reg || '-'}</span>
                                <span class="badge bg-secondary ms-2">${primary.tipe_ac || '-'}</span>
                                ${ronBadgeHtml}
                            </div>`;
                        
                        if (arr) {
                            let timeDisplay = arr.block_time ? formatTimeWithDate(arr.date, arr.block_time) : formatTimeWithDate(arr.date, (arr.jadwal || '-'));
                            bodyContent += `
                                <div class="pair-box border-danger border-opacity-50 border-start border-4">
                                    <div class="fs-7 text-muted fw-bold mb-1">Kedatangan</div>
                                    <div class="row g-1 fs-7 align-items-center">
                                        <div class="col-4 text-muted">Flight:</div><div class="col-8 text-end fw-bold">${arr.callsign || ''}${arr.flight_number || ''}</div>
                                        <div class="col-4 text-muted">ATA:</div><div class="col-8 text-end text-danger fw-bold d-flex justify-content-end align-items-center"><i class="bi bi-clock-fill me-1"></i> ${timeDisplay}</div>
                                    </div>
                                </div>`;
                        }
                    } else if (stand.status === 'STANDBY') {
                        if (arr) {
                            let timeDisplay = formatTimeWithDate(arr.date, (arr.jadwal || '-'));
                            bodyContent += `
                                <div class="pair-box border-warning border-opacity-50 border-start border-4">
                                    <div class="fs-6 fw-bold text-dark mb-1 d-flex justify-content-between align-items-center">
                                        <span><i class="bi bi-box-arrow-in-down-right text-warning me-1"></i> ARR: ${arr.callsign || ''}${arr.flight_number || ''}</span>
                                        ${stand.current.isRON ? '<span class="badge bg-primary" style="font-size:0.6rem;">RON</span>' : ''}
                                    </div>
                                    <div class="row g-1 fs-7 align-items-center">
                                        <div class="col-6 text-muted">Reg / Tipe:</div><div class="col-6 text-end fw-bold">${arr.reg || '-'} (${arr.tipe_ac || '-'})</div>
                                        <div class="col-6 text-muted">Est. STA:</div><div class="col-6 text-end fw-bold text-warning d-flex justify-content-end align-items-center">${timeDisplay}</div>
                                    </div>
                                </div>`;
                        }
                    }

                    if (dep) {
                        let timeDisplay = formatTimeWithDate(dep.date, (dep.jadwal || '-'));
                        bodyContent += `
                            <div class="pair-box border-primary border-opacity-50 border-start border-4 mt-2">
                                <div class="fs-7 text-muted fw-bold mb-1">Keberangkatan</div>
                                <div class="row g-1 fs-7 align-items-center">
                                    <div class="col-4 text-muted">Flight:</div><div class="col-8 text-end fw-bold">${dep.callsign || ''}${dep.flight_number || ''}</div>
                                    <div class="col-4 text-muted">STD:</div><div class="col-8 text-end fw-bold text-primary d-flex justify-content-end align-items-center">${timeDisplay}</div>
                                </div>
                            </div>`;
                    }
                    bodyContent += `</div>`; 

                    if (stand.next) {
                        let nArr = stand.next.arr;
                        let nDep = stand.next.dep;
                        let nPrimary = nArr || nDep;
                        let nTime = nArr ? formatTimeWithDate(nArr.date, nArr.jadwal) : (nDep ? formatTimeWithDate(nDep.date, nDep.jadwal) : '-');
                        
                        bodyContent += `
                            <div class="next-flight-banner shadow-sm mt-auto">
                                <div class="title"><i class="bi bi-info-circle-fill me-1"></i> NEXT PEMAKAIAN (STANDBY)</div>
                                <div class="details d-flex justify-content-between align-items-center">
                                    <span>${nPrimary.callsign || ''}${nPrimary.flight_number || ''} <small class="text-muted">(${nPrimary.reg || '-'})</small></span>
                                    <span class="badge bg-warning text-dark border border-warning shadow-sm d-flex align-items-center"><i class="bi bi-clock me-1"></i> ${nTime}</span>
                                </div>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="stand-header ${headerColor}">
                        <span>Parking Stand ${standKey}</span>
                        <div class="d-flex align-items-center">
                            <span class="status-badge ${badgeColor} text-white">${stand.status}</span>
                            ${isOver45 ? '<span class="remark-45"><i class="bi bi-exclamation-triangle-fill"></i>45 min</span>' : ''}
                        </div>
                    </div>
                    <div class="stand-body">
                        ${bodyContent}
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error("Gagal mensinkronkan data:", err);
        }
    }

    function applyTheme(theme) {
        const body = document.body;
        const toggle = document.getElementById('themeBadgeToggle');
        const optLight = document.getElementById('themeOptLight');
        const optDark = document.getElementById('themeOptDark');

        if (!toggle || !optLight || !optDark) return;

        const isDark = theme === 'dark';
        body.classList.toggle('dark-theme', isDark);
        toggle.classList.toggle('dark', isDark);

        optLight.classList.toggle('active', !isDark);
        optDark.classList.toggle('active', isDark);

        localStorage.setItem('ams_theme', isDark ? 'dark' : 'light');
    }

    function toggleThemeBadge() {
        const isDark = document.body.classList.contains('dark-theme');
        applyTheme(isDark ? 'light' : 'dark');
    }

    setInterval(updateParkingStands, 5000);
    async function logout() {
        if(!sbClient) return;
        await sbClient.auth.signOut();
        localStorage.removeItem('ams_user_name');
        localStorage.removeItem('ams_user_email');
        localStorage.removeItem('ams_user_id');
        window.location.replace('index.html');
    }
    window.onload = async () => {
        const savedTheme = localStorage.getItem('ams_theme') || 'light';
        applyTheme(savedTheme);

        await initUserProfile();
        updateParkingStands();
    };
</script>
